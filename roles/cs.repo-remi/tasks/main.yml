- name: Install gpg cert
  rpm_key:
    state: present
    key: https://rpms.remirepo.net/RPM-GPG-KEY-remi2021

- name: Ensure Remi's repo release package is installed and up-to-date
  dnf:
    name: "{{ php_repo_remi_package_name }}"
  register: ensure_remi_s_repo_release_package_is_installed_and_up_to_date_result
  retries: 30
  until: ensure_remi_s_repo_release_package_is_installed_and_up_to_date_result is succeeded
