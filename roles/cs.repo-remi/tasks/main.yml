- name: Install gpg cert
  rpm_key:
    state: present
    key: https://rpms.remirepo.net/RPM-GPG-KEY-remi2021
  register: remi_gpg_key_install_command
  retries: 10
  delay: 30
  until: not remi_gpg_key_install_command is failed

- name: Ensure Remi's repo release package is installed and up-to-date
  dnf:
    name: "{{ php_repo_remi_package_name }}"
  register: remi_release_install_command
  retries: 10
  delay: 30
  until: not remi_release_install_command is failed
