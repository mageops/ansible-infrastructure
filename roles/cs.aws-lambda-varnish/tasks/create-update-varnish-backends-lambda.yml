- name: Set varnish backend template vars
  set_fact:
    varnish_backend_template_vars:
      varnish_backend_port: "{{ mageops_varnish_backend_port }}"
      varnish_backend_probe_endpoint: "{{ varnish_backend_probe_endpoint }}"
      varnish_backend_max_conns: "{{ varnish_backend_max_conns }}"
      varnish_backend_first_byte_timeout: "{{ varnish_backend_first_byte_timeout }}"
      gtm_enabled: "{{ gtm_enabled | default(false) | bool }}"

- name: Check if varnish backends update lambda function exists
  ansible.builtin.command:
    argv:
      - aws
      - lambda
      - get-function-configuration
      - --region
      - "{{ aws_region }}"
      - --function-name
      - "{{ aws_lambda_update_varnish_backends_name }}"
  register: _lambda_facts
  changed_when: false
  failed_when: false

- name: Select varnish backends update lambda facts
  set_fact:
    _update_varnish_backends_lambda_fact: >-
      {{
        (_lambda_facts.stdout | default('') | length > 0)
        | ternary((_lambda_facts.stdout | from_json), {})
      }}

- name: Delete lambda function if it exists with different runtime
  amazon.aws.lambda:
    name: "{{ aws_lambda_update_varnish_backends_name }}"
    state: absent
    region: "{{ aws_region }}"
  when:
    - _update_varnish_backends_lambda_fact | length > 0
    - _update_varnish_backends_lambda_fact.Runtime != aws_lambda_varnish_runtime

- name: Register lambda handler for updating varnish backends
  block:
    - name: Upsert update varnish backends lambda
      amazon.aws.lambda:
        name: "{{ aws_lambda_update_varnish_backends_name }}"
        state: present
        zip_file: "{{ aws_lambda_varnish_deploy_package_path }}"
        runtime: "{{ aws_lambda_varnish_runtime }}"
        role: "arn:aws:iam::{{ aws_account_id }}:role/{{ aws_iam_role_update_varnish_backend_lambda_execution }}"
        handler: update_varnish_backends.handle
        region: "{{ aws_region }}"
        timeout: 120
        vpc_security_group_ids:
          - "{{ aws_security_group_lambda_ssh_id }}"
        vpc_subnet_ids: "{{ aws_vpc_subnet_ids }}"
        environment_variables:
          BACKEND_TEMPLATE: "{{ lookup('file', 'roles/cs.aws-lambda-varnish/templates/backends.vcl.j2') | to_json }}"
          BACKEND_TEMPLATE_VARS: "{{ varnish_backend_template_vars | to_json }}"
      register: update_varnish_backends_lambda
  rescue:
    - name: Delete varnish backends update lambda after failed registration attempt
      amazon.aws.lambda:
        name: "{{ aws_lambda_update_varnish_backends_name }}"
        state: absent
        region: "{{ aws_region }}"

    - name: Recreate varnish backends update lambda after failed registration attempt
      block:
        - name: Create varnish backends update lambda from scratch
          amazon.aws.lambda:
            name: "{{ aws_lambda_update_varnish_backends_name }}"
            state: present
            zip_file: "{{ aws_lambda_varnish_deploy_package_path }}"
            runtime: "{{ aws_lambda_varnish_runtime }}"
            role: "arn:aws:iam::{{ aws_account_id }}:role/{{ aws_iam_role_update_varnish_backend_lambda_execution }}"
            handler: update_varnish_backends.handle
            region: "{{ aws_region }}"
            timeout: 120
            vpc_security_group_ids:
              - "{{ aws_security_group_lambda_ssh_id }}"
            vpc_subnet_ids: "{{ aws_vpc_subnet_ids }}"
            environment_variables:
              BACKEND_TEMPLATE: "{{ lookup('file', 'roles/cs.aws-lambda-varnish/templates/backends.vcl.j2') | to_json }}"
              BACKEND_TEMPLATE_VARS: "{{ varnish_backend_template_vars | to_json }}"
          register: update_varnish_backends_lambda
      rescue:
        - name: Wait for varnish backends update lambda to become active after recreation timeout
          ansible.builtin.command:
            argv:
              - aws
              - lambda
              - get-function-configuration
              - --region
              - "{{ aws_region }}"
              - --function-name
              - "{{ aws_lambda_update_varnish_backends_name }}"
          register: update_varnish_backends_lambda_info
          changed_when: false
          failed_when: false
          until: >-
            (
              (
                update_varnish_backends_lambda_info.stdout | default('{}')
                | from_json
              ).State | default('')
            ) == 'Active'
          retries: "{{ aws_lambda_varnish_wait_retries }}"
          delay: "{{ aws_lambda_varnish_wait_delay }}"

        - name: Normalize varnish backends update lambda result after recreation timeout
          set_fact:
            update_varnish_backends_lambda:
              changed: true
              configuration:
                function_arn: "{{ (update_varnish_backends_lambda_info.stdout | from_json).FunctionArn }}"
      always:
        - name: Fail if varnish backends update lambda is still unavailable after recreation
          fail:
            msg: "{{ ansible_failed_result.msg | default('Recreating varnish backends update lambda failed') }}"
          when: update_varnish_backends_lambda is not defined
