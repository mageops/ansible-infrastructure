# This task should be executed with import_role:
#
# - name: Provision pio on app node
#   import_role:
#     name: cs.pio
#     tasks_from: app
#

- name: Install pio-worker rpm
  include_tasks: install_rpm.yml

- name: Write service config
  template:
    src: "pio-worker.default.j2"
    dest: "/etc/default/pio-worker"
    mode: 0644

- name: Ensure service directory exists
  file:
    path: "/etc/systemd/system/pio-worker.service.d"
    state: directory
    mode: 0755

# One-time migration of root-owned cache entries. TODO: remove after 2027-01-28.
- name: Check pio cache owner migration marker
  stat:
    path: "{{ pio_cache_owner_done_marker }}"
  register: _pio_cache_owner_done
  when: pio_filesystem == 'local'

# The worker can run as the Magento user only after it owns, or can write, every cache entry.
- name: Select pio-worker user
  set_fact:
    _pio_worker_user: >-
      {{ pio_worker_user or ((_pio_cache_owner_done.stat.exists | default(false)) | ternary(magento_user, '')) }}

- name: Install pio cache owner migration
  when: pio_filesystem == 'local'
  block:
    - name: Install pio cache owner migration script
      template:
        src: "pio-cache-owner.sh.j2"
        dest: "/usr/local/bin/pio-cache-owner"
        mode: 0755

    - name: Install pio cache owner migration service
      template:
        src: "pio-cache-owner.service.j2"
        dest: "/etc/systemd/system/pio-cache-owner.service"
        mode: 0644

- name: Write service override
  template:
    src: "pio-worker.override.conf.j2"
    dest: "/etc/systemd/system/pio-worker.service.d/override.conf"
    mode: 0644

- name: Enable service
  service:
    name: pio-worker
    enabled: true
    state: restarted
    daemon_reload: yes
