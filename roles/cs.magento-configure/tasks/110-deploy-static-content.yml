- name: Prepare static content deployment options
  set_fact:
    _magento_scd_deploy_options: >-
      {{
        []
        + (magento_scd_no_javascript | bool | ternary(['--no-javascript'], []))
        + (magento_scd_no_js_bundle | bool | ternary(['--no-js-bundle'], []))
        + (magento_scd_no_css | bool | ternary(['--no-css'], []))
        + (magento_scd_no_less | bool | ternary(['--no-less'], []))
        + (magento_scd_no_images | bool | ternary(['--no-images'], []))
        + (magento_scd_no_fonts | bool | ternary(['--no-fonts'], []))
        + (magento_scd_no_html | bool | ternary(['--no-html'], []))
        + (magento_scd_no_misc | bool | ternary(['--no-misc'], []))
        + (magento_scd_no_html_minify | bool | ternary(['--no-html-minify'], []))
        + (magento_scd_no_parent | bool | ternary(['--no-parent'], []))
      }}

- name: Show information about SCD start
  debug:
    msg: |
      ============================================
      ==========  Starting Magento SCD   =========
      ============================================

       Using {{ magento_scd_strategy }} strategy with {{ magento_scd_parallel_jobs }} parallel jobs.

        Using languages:
        {% for lang in magento_scd_languages %}
          - {{ lang }}
        {% endfor %}

      {% if magento_scd_excluded_themes -%}
        Excluding themes:
        {% for theme in magento_scd_excluded_themes %}
          - {{ theme }}
        {% endfor %}
      {% endif %}

      {% if _magento_scd_deploy_options | length > 0 -%}
        Using additional options:
        {% for option in _magento_scd_deploy_options %}
          - {{ option }}
        {% endfor %}
      {% endif %}

      ============================================
- name: Deploy static content
  block:
    - name: Deploy static content
      become: yes
      become_user: "{{ magento_user }}"
      command: >
        php {{ magento_release_dir }}/bin/magento setup:static-content:deploy \
          {% for theme in magento_scd_excluded_themes -%}
            --exclude-theme "{{ theme }}" \
          {% endfor %}
          {{ _magento_scd_deploy_options | join(' ') }} \
          -s "{{ magento_scd_strategy }}" \
          -j {{ magento_scd_parallel_jobs }} \
          {{ magento_scd_languages | join(' ') }}
      register: magento_scd
      changed_when: true
  rescue:
    - name: Deploy static content with a single job
      become: yes
      become_user: "{{ magento_user }}"
      command: >
        php {{ magento_release_dir }}/bin/magento setup:static-content:deploy \
          {% for theme in magento_scd_excluded_themes -%}
            --exclude-theme "{{ theme }}" \
          {% endfor %}
          {{ _magento_scd_deploy_options | join(' ') }} \
          -s "{{ magento_scd_strategy }}" \
          -j 1 \
          {{ magento_scd_languages | join(' ') }}
      register: magento_scd
      changed_when: true

- name: Set information about Magento SCD
  set_fact:
    magento_scd_rc: "{{ magento_scd.rc }}"
    magento_scd_duration: "{{ magento_scd.delta }}"
    magento_scd_command: "{{ magento_scd.cmd | join(' ') }}"
    magento_scd_output: "{{ magento_scd.stdout }}"
    magento_scd_error_output: "{{ magento_scd.stderr }}"

- name: Show static content deployment logs
  debug:
    msg: |
      ============================================
      ==========  Magento SCD Complete   =========
      ============================================

      ----------------  Duration  ----------------

                    {{ magento_scd_duration }}

      ----------------  Command  -----------------

      {{ magento_scd_command }}

      ----------------  Output  ------------------

      {{ magento_scd_output }}

      Return code:
      {{ magento_scd_rc }}

      -----------  Error output (stderr)  --------

      {{ magento_scd_error_output | default('(no stderr output)', true) }}

      ============================================

- name: Fail deploy when static content deployment reports errors
  fail:
    msg: |
      Magento SCD reported errors. Deployment is aborted.

      Command:
      {{ magento_scd_command }}

      Return code:
      {{ magento_scd_rc }}

      Output:
      {{ magento_scd_output | default('(no stdout output)', true) }}

      Error output (stderr):
      {{ magento_scd_error_output | default('(no stderr output)', true) }}
  when:
    - (magento_scd_rc | int) != 0
      or (magento_scd_output | default('') is search('(?i)(error|exception|fatal)'))
      or (magento_scd_error_output | default('') is search('(?i)(error|exception|fatal)'))

- name: Execute post static-content deploy containerized tasks
  block:
    - name: Execute containerized tasks
      include_role:
        name: cs.deploy-containerized-tasks
      vars:
        containerized_tasks: "{{ magento_scd_containerized_tasks }}"
  when: magento_scd_containerized_tasks | length > 0
  become: yes
  become_user: root
