- name: Install nodejs and yarn
  dnf:
    name:
      - nodejs
      - yarnpkg
    state: latest
  register: install_nodejs_and_yarn_result
  retries: 30
  until: install_nodejs_and_yarn_result is succeeded

- name: Install user-global NPM packages
  npm:
    state: present
    global: yes
    name: "{{ item }}"
  loop: "{{ nodejs_packages }}"
  when: not nodejs_use_yarn

- name: Install user-global Yarn packages
  yarn:
    state: present
    global: yes
    name: "{{ item }}"
  loop: "{{ nodejs_packages }}"
  when: nodejs_use_yarn
