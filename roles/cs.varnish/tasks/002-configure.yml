# Prevents unneeded shmlog disk I/O
- name: Mount VSL under tmpfs
  block:
    - name: Ensure VSL tmpfs entry exists in fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '^\s*none\s+/var/lib/varnish\s+tmpfs\s+'
        line: 'none /var/lib/varnish tmpfs rw,auto,noatime 0 0'
      notify:
        - Restart varnish
        - Restart varnish-exporter

    - name: Read current VSL mount state
      ansible.builtin.command: findmnt -n -o FSTYPE,OPTIONS /var/lib/varnish
      register: _varnish_vsl_mount_state
      changed_when: false
      failed_when: false

    - name: Set VSL mount state facts
      ansible.builtin.set_fact:
        _varnish_vsl_is_tmpfs: >-
          {{ (_varnish_vsl_mount_state.rc | default(1)) == 0
             and ((_varnish_vsl_mount_state.stdout | default('') | trim).split(' ') | first) == 'tmpfs' }}
        _varnish_vsl_has_noatime: >-
          {{ (_varnish_vsl_mount_state.rc | default(1)) == 0
             and (_varnish_vsl_mount_state.stdout | default('') | regex_search('(^|,)noatime(,|$)')) is not none }}

    - name: Ensure VSL mount path is not occupied by non-tmpfs mount
      ansible.builtin.assert:
        that:
          - (_varnish_vsl_mount_state.rc | default(1)) != 0 or (_varnish_vsl_is_tmpfs | bool)
        fail_msg: >-
          /var/lib/varnish is already mounted with non-tmpfs filesystem.
          Existing mount details: `{{ _varnish_vsl_mount_state.stdout | default('') | trim }}`.

    - name: Mount VSL tmpfs from fstab
      ansible.builtin.command: mount /var/lib/varnish
      when: (_varnish_vsl_mount_state.rc | default(1)) != 0
      changed_when: true
      notify:
        - Restart varnish
        - Restart varnish-exporter

    - name: Remount VSL tmpfs with noatime
      ansible.builtin.command: mount -o remount,rw,noatime /var/lib/varnish
      when:
        - _varnish_vsl_is_tmpfs | bool
        - not (_varnish_vsl_has_noatime | bool)
      changed_when: true
      notify:
        - Restart varnish
        - Restart varnish-exporter

- name: Ensure varnish var directories always exist
  lineinfile:
    path: /etc/tmpfiles.d/varnish.conf
    regexp: "\\s+{{ varnish_run_dir | regex_escape }}\\s+"
    line: "d {{ varnish_run_dir }} 0755 varnish varnish - -"
    create: yes
  register: tmpfiles_config

- name: Ensure var directory changes are applied at once
  command: systemd-tmpfiles --create
  when: tmpfiles_config is changed

- name: Generate Varnish error page HTML files
  template:
    src: "error_pages/error{{ item }}.html.j2"
    dest: "/etc/varnish/error{{ item }}.html"
  vars:
    status_code: "{{ item }}"
    _varnish_error_color_palete: "{{ varnish_error_color_palete_default | combine(varnish_error_color_palete) }}"
  with_items:
    - 401
    - 429
    - 500
    - 502
    - 503
    - 504
  notify: Reload varnish

- name: Ensure Varnish systemd config override directory exists
  file:
    path: /etc/systemd/system/varnish.service.d/
    state: directory

- name: Configure Varnish Systemd Service
  template:
    src: varnish.service.overrides.conf
    dest: /etc/systemd/system/varnish.service.d/mageops.conf
    trim_blocks: no
  notify:
    - Reload systemctl daemon
    - Restart varnish

- name: Configure Varnish Default VCL
  template:
    src: "vcl/default.vcl.j2"
    dest: "{{ varnish_vcl_conf }}"
    group: "{{ varnish_group }}"
    mode: 0644
    force: yes
  notify: Reload varnish

- name: Configure Varnish Backends VCL
  template:
    src: vcl/backends.vcl.j2
    dest: "{{ varnish_backends_vcl }}"
    group: "{{ varnish_group }}"
    mode: 0664
    force: yes
  notify: Reload varnish

- name: Ensure Varnish service is started and enabled
  service:
    name: varnish
    enabled: yes
    state: started
