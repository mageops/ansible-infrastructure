- name: Print EC2 instance lookup filters for nodes
  debug:
    msg:
      node: "{{ node.name }}"
      filters: "{{ aws_node_facts_base_filters | combine(aws_node_facts_base_tags | combine(node.node_tags) | prefix_keys('tag:')) }}"
  loop:
    - name: app_builder
      node_tags: "{{ aws_tags_role_app_builder }}"
    - name: persistent
      node_tags: "{{ aws_tags_role_persistent }}"
    - name: varnish_loadbalancer
      node_tags: "{{ aws_tags_role_loadbalancer | combine(aws_tags_role_varnish_http_cache) }}"
    - name: elasticsearch
      node_tags: "{{ aws_tags_role_elasticsearch }}"
    - name: redis
      node_tags: "{{ aws_tags_role_redis_cache }}"
  loop_control:
    loop_var: node
    label: "{{ node.name }}"

- name: Get EC2 instance information for nodes
  ec2_instance_info:
    region: "{{ aws_region }}"
    filters: "{{ aws_node_facts_base_filters | combine(aws_node_facts_base_tags | combine(node.node_tags) | prefix_keys('tag:')) }}"
  loop:
    - name: app_builder
      node_tags: "{{ aws_tags_role_app_builder }}"
    - name: persistent
      node_tags: "{{ aws_tags_role_persistent }}"
    - name: varnish_loadbalancer
      node_tags: "{{ aws_tags_role_loadbalancer | combine(aws_tags_role_varnish_http_cache) }}"
    - name: elasticsearch
      node_tags: "{{ aws_tags_role_elasticsearch }}"
    - name: redis
      node_tags: "{{ aws_tags_role_redis_cache }}"
  loop_control:
    loop_var: node
    label: "{{ node.name }}"
  register: aws_node_instance_facts

- name: Set facts about node instances
  set_fact:
    aws_nodes_info: >-
      {{
          aws_nodes_info | default({}) | combine({
              result.node.name: (
                (
                  result.instances
                  | selectattr('state.name', 'equalto', 'running')
                  | sort(attribute='launch_time')
                  | list
                )
                | last
                | default(
                    (
                      result.instances
                      | sort(attribute='launch_time')
                      | list
                    )
                    | last
                    | default(false),
                    true
                  )
              )
          })
      }}
  loop: "{{ aws_node_instance_facts.results | default([]) }}"
  loop_control:
    loop_var: result
    label: "{{ result.node.name }}"

- name: Print info about running nodes
  debug:
    msg: >-
      {{ item.key }} instance:
      {% if item.value %}
      {{ item.value.instance_id | default('unknown') }}
      ({{ item.value.private_ip_address | default('N/A') }} /
      {{ item.value.public_ip_address | default('N/A') }})
      {% else %}
      not found
      {% endif %}
  loop: "{{ aws_nodes_info | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Set facts about nodes
  set_fact:
    aws_app_builder_node_instance: "{{ aws_nodes_info.app_builder | default(omit, true) }}"
    aws_persistent_node_instance: "{{ aws_nodes_info.persistent | default(omit, true) }}"
    aws_varnish_node_instance: "{{ aws_nodes_info.varnish_loadbalancer | default(omit, true) }}"
    aws_app_builder_node_ami_id: "{{ aws_nodes_info.app_builder.image_id | default(omit, true) }}"
    aws_persistent_node_ami_id: "{{ aws_nodes_info.persistent.image_id | default(omit, true) }}"
    aws_varnish_node_ami_id: "{{ aws_nodes_info.varnish_loadbalancer.image_id | default(omit, true) }}"
    # Ansible require at least one variable to be set in set_fact, this dummy set is required in case there is no instances present
    _dummy: "_"

- name: Set varnish host to varnish loadbalancer
  set_fact:
    mageops_varnish_host: "{{ aws_nodes_info.varnish_loadbalancer.private_ip_address }}"
  when:
    - varnish_as_loadbalancer
    - aws_nodes_info.varnish_loadbalancer is defined
    - aws_nodes_info.varnish_loadbalancer is not sameas false

- name: Set elasticsearch host if not predefined
  set_fact:
    mageops_elasticsearch_host: "{{ aws_nodes_info.elasticsearch.private_ip_address }}"
  when:
    - not mageops_elasticsearch_host | default(false, true)
    - aws_nodes_info.elasticsearch is defined
    - aws_nodes_info.elasticsearch is not sameas false

- name: Set opensearch host if not predefined
  set_fact:
    mageops_opensearch_host: "{{ aws_nodes_info.elasticsearch.private_ip_address }}"
  when:
    - not mageops_opensearch_host | default(false, true)
    - aws_nodes_info.elasticsearch is defined
    - aws_nodes_info.elasticsearch is not sameas false


