- name: Workaround SHA-1 gpg key enable
  shell: update-crypto-policies --set LEGACY

- name: Download gpg cert
  command: curl -fsSL -o /etc/pki/rpm-gpg/GPG-KEY-opensearch {{ repo_opensearch_gpg_url }}
  args:
    creates: /etc/pki/rpm-gpg/GPG-KEY-opensearch

- name: Install gpg cert
  rpm_key:
    state: present
    key: /etc/pki/rpm-gpg/GPG-KEY-opensearch

- name: Install opensearch repo
  template:
    src: opensearch.repo
    dest: "/etc/yum.repos.d/opensearch.repo"
    mode: 0644
