- name: Ensure Java 7 is gone
  dnf:
    name: java-1.7.0-openjdk
    state: absent
  register: ensure_java_7_is_gone_result
  retries: 30
  until: ensure_java_7_is_gone_result is succeeded

- name: Ensure Java 8 is installed
  dnf:
    name: java-1.8.0-openjdk
    state: latest
  register: ensure_java_8_is_installed_result
  retries: 30
  until: ensure_java_8_is_installed_result is succeeded
