- name: Ensure var directories always exist
  lineinfile:
    state: present
    create: yes
    path: /etc/tmpfiles.d/{{ redis_daemon }}.conf
    regexp: "\\s+{{ entry.path | regex_escape }}\\s+"
    line: >-
      {{ entry.type | default('d') }}
      {{ entry.path }}
      {{ entry.mode | default('0755') }}
      {{ entry.user | default(redis_valkey_flavor) }}
      {{ entry.group | default(redis_valkey_flavor) }}
      {{ entry.age | default('-') }}
      {{ entry.argument | default('-') }}
  loop:
    - path: "{{ redis_dbdir }}"
    - path: "{{ redis_piddir }}"
    - path: "{{ redis_logdir }}"
    - path: "{{ redis_logdir }}/*.log"
      mode: '0644'
      type: z
  loop_control:
    loop_var: entry
    label: "{{ entry.path }}"
  register: tmpfiles_config

- name: Ensure var directory changes are applied at once
  command: systemd-tmpfiles --create
  when: tmpfiles_config is changed

- name: Install systemd service file
  template:
    src: "redis.service"
    dest: "/etc/systemd/system/{{ redis_daemon }}.service"
    trim_blocks: yes
    lstrip_blocks: yes
  notify:
    - Reload systemctl daemon
    - "Restart redis/valkey"

- name: Ensure service override direcotry exists
  file:
    path: /etc/systemd/system/{{ redis_daemon }}.service.d
    state: directory

- name: Install systemd limits service file
  template:
    src: redis.limit.conf
    dest: "/etc/systemd/system/{{ redis_daemon }}.service.d/limit.conf"
    trim_blocks: yes
    lstrip_blocks: yes
  notify:
    - Reload systemctl daemon
    - "Restart redis/valkey"

- name: Install redis/valkey configuration
  template:
    src: redis.conf
    dest: "{{ redis_conf_path }}"
    mode: 0644
  notify:
    - "Restart redis/valkey"

# This avoids OOM errors when redis saves to disk!
#
# Please see "Background saving fails with a fork() error under Linux even if I have a lot of free RAM!"
# here https://redis.io/topics/faq
#
# This needs to be enabled only when we have snapshotting.
- name: Enable memory overcommit kernel param
  sysctl:
    name: vm.overcommit_memory
    value: 1
    reload: yes
    state: present
  when: redis_persistence_enable

- name: Increase somaxconn kernel param
  sysctl:
    name: net.core.somaxconn
    value: "{{ redis_somaxconn }}"
    reload: yes
    state: present

- name: Ensure  {{ redis_daemon }} service is enabled
  service:
    name: "{{ redis_daemon }}"
    enabled: yes

- name: Make sure rc.local is executable
  file:
    path: /etc/rc.d/rc.local
    state: file
    mode: 0750

- name: Disable Transparent Huge Pages on boot to help latency
  lineinfile:
    path: /etc/rc.d/rc.local
    state: present
    line: "{{ item }}"
  with_items:
    - "echo never > /sys/kernel/mm/transparent_hugepage/enabled"
    - "echo never > /sys/kernel/mm/transparent_hugepage/defrag"
  register: _redis_enabled_thd
  notify: "Restart redis/valkey"

- name: Disable THP now if just added
  shell: "{{ item }}"
  with_items:
    - "echo never > /sys/kernel/mm/transparent_hugepage/enabled"
    - "echo never > /sys/kernel/mm/transparent_hugepage/defrag"
  when: _redis_enabled_thd.changed

- name: Gather service facts
  ansible.builtin.service_facts:

- name: Stop {{ redis_uninstalling_flavor }} in case of migration
  service:
    name: "{{ redis_uninstalling_flavor }}"
    state: stopped
    enabled: false
  when: services[redis_uninstalling_flavor+'.service']['status'] | default('not-found') != 'not-found'

- name: Stop {{ redis_uninstalling_flavor }} session in case of migration
  service:
    name: "{{ redis_uninstalling_flavor }}-sessions"
    state: stopped
    enabled: false
  when: mageops_redis_sessions_create and services[redis_uninstalling_flavor+'-sessions.service']['status'] | default('not-found') != 'not-found'

- name: Ensure Redis/valkey service is started
  service:
    name: "{{ redis_daemon }}"
    state: started
    enabled: yes

