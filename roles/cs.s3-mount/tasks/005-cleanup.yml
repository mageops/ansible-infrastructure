- name: Make sure backup root bind mount is absent
  ansible.posix.mount:
    path: "{{ _s3fs_premount_temp_dir.path }}"
    state: unmounted
  register: _s3_cleanup_mount
  failed_when: false

- name: Remove backup mount temp dir
  file:
    path: "{{ _s3fs_premount_temp_dir.path }}"
    state: absent
