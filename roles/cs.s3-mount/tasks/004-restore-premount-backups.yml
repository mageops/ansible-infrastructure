- name: Bind mount rootfs to temp dir
  block:
    - name: Read backup root bind mount state
      ansible.builtin.command: findmnt -n -o SOURCE,FSTYPE {{ _s3fs_premount_temp_dir.path }}
      register: _s3_premount_bind_state
      changed_when: false
      failed_when: false

    - name: Ensure backup root bind mount is not occupied by another source
      ansible.builtin.assert:
        that:
          - (_s3_premount_bind_state.rc | default(1)) != 0
            or ((_s3_premount_bind_state.stdout | default('') | trim).split() | first) == '/'
        fail_msg: >-
          Temporary premount backup path is already mounted from another source:
          `{{ _s3_premount_bind_state.stdout | default('') | trim }}`.

    - name: Bind mount rootfs to temp dir
      ansible.posix.mount:
        src: /
        path: "{{ _s3fs_premount_temp_dir.path }}"
        fstype: none
        opts: bind
        state: ephemeral
      when: (_s3_premount_bind_state.rc | default(1)) != 0

- name: Restore premount backup to new mountpoints
  shell: >
    rsync --archive \
          --verbose \
          --itemize-changes \
          --no-owner \
          --no-group \
          --no-times \
          --ignore-times \
          --ignore-existing \
          --inplace \
          --whole-file \
          --executability \
          --remove-source-files \
          '{{ s3fs_bind_mount.target.rstrip('/') }}/' \
          '{{ s3fs_bind_mount.source.rstrip('/') }}/'
  register: _s3fs_mountpoint_backup_restore_sync
  loop: "{{ s3fs_premount_bind_mounts }}"
  loop_control:
    loop_var: s3fs_bind_mount

- name: Print remount file restore log
  debug:
    msg: >-
      {{
        _s3fs_mountpoint_backup_restore_sync.results
        | default([])
        | map(attribute='stdout_lines')
        | list
        | flatten
      }}
