- hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  environment: >-
    {{
      (aws_profile is defined and (aws_profile | string | length > 0))
      | ternary(
          {
            'AWS_PROFILE': aws_profile,
            'AWS_DEFAULT_PROFILE': aws_profile,
          },
          {}
        )
    }}
  roles:
    - role: cs.aws-iam
    - role: cs.aws-iam-employee-access
