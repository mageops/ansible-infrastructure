###
# *** This playbook deploys `shlink` URL shortener ***
#
# You must provide values for at least these vars in your project config:
#   shlink_short_domain:
#   shlink_geolite_license_key:
#
# Refer to `cs.shlink` role defaults for further configuration options.
###

- hosts: localhost
  connection: local
  roles:
    - role: cs.aws-region-facts
    - role: cs.aws-ami-facts
      ami_facts_instance: "{{ aws_shlink_node_instance_type }}"
    - role: cs.aws-security-group-shlink
    - role: cs.aws-node-shlink
      aws_shlink_node_instance_name: "{{ mageops_app_name }}-shlink"
      aws_tags_shlink:
        Role: "shlink"
      aws_shlink_node_root_device: "{{ aws_ami_clean_base_info[aws_shlink_node_instance_type].root_device_name }}"
      aws_shlink_node_vpc_subnet_id: "{{ aws_vpc_subnet_id }}"
      aws_shlink_instance_id: "{{ aws_shlink_node_instance.instance_id | default(false) }}"

- hosts: shlink
  gather_facts: yes
  vars:
    ### Base shlink MageSuite config

    shlink_user: shlink
    shlink_group: shlink
    shlink_home: "/home/{{ shlink_user }}"
    shlink_http_bind_port: 8080
    shlink_http_bind_host: 127.0.0.1

    ### Base MageOps params

    mageops_app_type: "shlink"
    mageops_app_user: "{{ shlink_user }}"
    mageops_app_group: "{{ shlink_group }}"
    mageops_node_role: "{{ mageops_app_type }}"

    ### Base system config

    packages_install: "{{ mageops_packages_common }}"

    firewall_enable: not (aws_use | default(false))
    firewall_public_services:
      - http
      - https

    nginx_blacklist_vhost_check_include_file: ~

    https_termination_hosts: []

    https_termination_proxy_http_port: yes

    https_termination_upstream_host: 127.0.0.1
    https_termination_upstream_port: "{{ shlink_http_bind_port }}"
    https_termination_upstream: "{{ https_termination_upstream_host }}:{{ https_termination_upstream_port }}"

    https_termination_crt_acme_email: filip.sobalski@creativestyle.pl

  pre_tasks:
    - name: Initialize short domain list
      set_fact:
        shlink_domains: "{{ [shlink_short_domain] + shlink_short_domains_extra | default([]) }}"

    - name: Compute vhost configuration
      set_fact:
        https_termination_hosts: "{{ https_termination_hosts + [host] }}"
      vars:
        host:
          name: "{{ domain }}"
          server_name: "{{ domain }}"
          letsencrypt: yes
      loop: "{{ shlink_domains }}"
      loop_control:
        loop_var: domain

    - name: Automatically configure MySQL host as RDS instance
      when: >-
          aws_use
          and shlink_mysql_db_name | default(false, true)
          and shlink_mysql_db_pass | default(false, true)
          and not shlink_mysql_db_host | default(false, true)
      delegate_to: localhost
      delegate_facts: no
      become: no
      block:
        - name: Compute AWS rds facts
          include_role:
            name: cs.aws-rds-facts

        - name: Set shlink MySQL host
          set_fact:
            shlink_mysql_db_host: "{{ aws_rds_instance_host }}"

  roles:
    - role: geerlingguy.ntp
    - role: cs.switch-to-dnf
    - role: cs.cron
    - role: cs.swap
    - role: cs.earlyoom
    - role: cs.packages
    - role: cs.provisioning-migrations

    - role: cs.mageops-cli-user
      mageops_cli_user: root

    - role: cs.mageops-cli-user
      mageops_cli_user: "{{ mageops_app_user }}"
      mageops_cli_user_group: "{{ mageops_app_group }}"
      mageops_cli_user_uid: "{{ mageops_app_uid }}"
      mageops_cli_user_gid: "{{ mageops_app_gid }}"

    - role: cs.mageops-cli-profile
    - role: cs.mageops-authorize-keys
      mageops_ssh_authorize_app: yes
    - role: cs.shlink
    - role: cs.nginx-https-termination
      nginx_vhost_template: "nginx.vhost_shlink.conf"
      https_termination_upstream_port: 8080
      mageops_pio_worker_enable: false
      nginx_blacklist_vhost_check_include_file: false




