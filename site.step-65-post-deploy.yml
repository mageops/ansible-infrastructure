- import_playbook: site.common.group-current-hosts.yml

- hosts: app:&current
  gather_facts: no
  tasks:
    - name: Wait app nodes to be reachble
      wait_for_connection:
        delay: 10
        timeout: 300

- hosts: app:&current
  gather_facts: no
  tasks:
    - name: Run Magento post-deploy setup
      command: "{{ item.cmd | default(item) }}"
      args:
        chdir: "{{ item.dir | default(magento_live_release_dir) }}"
      run_once: true
      become: yes
      become_user: "{{ magento_user }}"
      loop: "{{ commands_base + magento_post_deploy_commands | default([]) }}"
      loop_control:
        label: "{{ item.cmd | default(item) }}"
      register: out
      vars: 
        commands_base:
          - "bin/magento app:config:import --no-interaction"
          - "bin/magento setup:upgrade --keep-generated"
          - "bin/magento maintenance:disable"

    - name: Show Magento post-deploy output
      debug:
        msg: "{{ result.stdout | default('--- N/A ---') }}"
      loop: "{{ out.results }}"
      loop_control:
        loop_var: result
        label: "{{ result.cmd | default([]) | join(' ') }}"

    - name: Start Magento services
      service:
        name: "{{ service_name }}"
        state: started
      loop:
        - magento-node-warmup.service
        - supervisord.service
      loop_control:
        loop_var: service_name

# One-time migration of root-owned pio cache entries. TODO: remove after 2027-01-28.
# This play runs after the ASG instance refresh. No node with the old worker configuration still writes.
# The service runs in the background and does not block the deploy.
# When the next deploy replaces this node, the next run continues from the saved progress.
- hosts: app:&current:&immutable
  gather_facts: no
  tasks:
    - name: Start pio cache owner migration
      systemd:
        name: pio-cache-owner.service
        state: started
        daemon_reload: yes
      run_once: true
      when: mageops_pio_worker_enable and pio_filesystem == 'local'
