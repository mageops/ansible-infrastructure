---
- name: Validate MageOps vars loading for Jenkins
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    mageops_debug_watch_var: >-
      {{
        (
          lookup('ansible.builtin.env', 'ANSIBLE_MAGEOPS_VARS_DEBUG_WATCH')
          | default('', true)
          | regex_replace(',', ' ')
          | split()
          | first
          | default('', true)
        )
        or 'aws_vpc_subnet_prefix'
      }}

  tasks:
    - name: Assert MageOps vars plugin loaded project vars
      ansible.builtin.assert:
        that:
          - mageops_vars_plugin_loaded | default(false) | bool
          - mageops_project_vars_loaded | default(false) | bool
        fail_msg: >-
          MageOps project vars were not loaded. Verify ansible.cfg uses ./vars_plugins
          and vars/project/*.yml is present in the Jenkins workspace.

    - name: Show MageOps project context
      ansible.builtin.debug:
        msg:
          mageops_project: "{{ mageops_project | default('<undefined>') }}"
          mageops_environment: "{{ mageops_environment | default('<undefined>') }}"
          mageops_project_vars_loaded: "{{ mageops_project_vars_loaded | default(false) }}"

    - name: Detect if vars debug report is available
      ansible.builtin.set_fact:
        mageops_debug_report_available: >-
          {{
            mageops_vars_debug_report is defined
            and mageops_debug_watch_var in mageops_vars_debug_report
          }}

    - name: Assert watched variable was loaded by MageOps vars plugin (debug report mode)
      ansible.builtin.assert:
        that:
          - mageops_vars_debug_report[mageops_debug_watch_var].loaded | bool
        fail_msg: >-
          Variable {{ mageops_debug_watch_var }} was not loaded by mageops vars plugin.
          Source trace is available only when Jenkins runs with
          ANSIBLE_MAGEOPS_VARS_DEBUG_WATCH={{ mageops_debug_watch_var }}
      when: mageops_debug_report_available

    - name: Assert watched variable exists at runtime (fallback mode)
      ansible.builtin.assert:
        that:
          - hostvars[inventory_hostname][mageops_debug_watch_var] is defined
        fail_msg: >-
          Could not verify {{ mageops_debug_watch_var }}.
          The plugin debug report was not available and the runtime variable is undefined.
          Set ANSIBLE_MAGEOPS_VARS_DEBUG_WATCH={{ mageops_debug_watch_var }} in Jenkins
          to get direct plugin source tracing.
      when: not mageops_debug_report_available

    - name: Show watched variable load details (debug report mode)
      ansible.builtin.debug:
        msg:
          verification_mode: vars_plugin_debug_report
          watched_var: "{{ mageops_debug_watch_var }}"
          loaded: "{{ mageops_vars_debug_report[mageops_debug_watch_var].loaded }}"
          files: "{{ mageops_vars_debug_report[mageops_debug_watch_var].files }}"
          value: "{{ hostvars[inventory_hostname][mageops_debug_watch_var] | default('<undefined>') }}"
      when: mageops_debug_report_available

    - name: Show watched variable load details (fallback mode)
      ansible.builtin.debug:
        msg:
          verification_mode: fallback_file_compare
          watched_var: "{{ mageops_debug_watch_var }}"
          loaded: "{{ hostvars[inventory_hostname][mageops_debug_watch_var] is defined }}"
          files: []
          value: "{{ hostvars[inventory_hostname][mageops_debug_watch_var] | default('<undefined>') }}"
          note: >-
            Set ANSIBLE_MAGEOPS_VARS_DEBUG_WATCH={{ mageops_debug_watch_var }}
            in Jenkins for direct plugin source tracing.
      when: not mageops_debug_report_available
